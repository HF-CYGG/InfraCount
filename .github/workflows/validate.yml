name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest tests -v

      - name: Compile Python modules
        run: python -m compileall api app tools tcp_server.py

      - name: Verify API contract
        run: python tools/verify_api_contract.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck frontend
        working-directory: web
        run: npm run typecheck

      - name: Build frontend assets
        working-directory: web
        run: npm run build

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    env:
      CI_COMPOSE_PROJECT: infracount-ci
      CI_WEB_PORT: "18000"
      CI_TCP_PORT: "18085"
      CI_IMAGE: infracount:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create isolated test credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_ADMIN_PASSWORD=ci-admin-%s\n' "$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"
          printf 'CI_USER_PASSWORD=ci-user-%s\n' "$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT }}
          INFRACOUNT_IMAGE: ${{ env.CI_IMAGE }}
          WEB_PORT: ${{ env.CI_WEB_PORT }}
          TCP_PORT: ${{ env.CI_TCP_PORT }}
          INITIAL_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker/docker-compose.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for Compose validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: infracount:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Compose service and wait for health
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT }}
          INFRACOUNT_IMAGE: ${{ env.CI_IMAGE }}
          WEB_PORT: ${{ env.CI_WEB_PORT }}
          TCP_PORT: ${{ env.CI_TCP_PORT }}
          INITIAL_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker/docker-compose.yml up --detach --no-build
          container_id="$(docker compose --env-file .env.example -f docker/docker-compose.yml ps --quiet infracount)"
          test -n "$container_id"
          printf 'CI_CONTAINER_ID=%s\n' "$container_id" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify container runtime and service boundaries
        shell: bash
        env:
          CI_CONTAINER_ID: ${{ env.CI_CONTAINER_ID }}
          CI_WEB_PORT: ${{ env.CI_WEB_PORT }}
          CI_TCP_PORT: ${{ env.CI_TCP_PORT }}
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.Config.User}}' "$CI_CONTAINER_ID")" != ""
          test "$(docker exec "$CI_CONTAINER_ID" id -u)" -ne 0
          curl --fail --silent --show-error "http://127.0.0.1:${CI_WEB_PORT}/api/v1/health" > /dev/null
          python -c 'import socket, sys; sock = socket.create_connection(("127.0.0.1", int(sys.argv[1])), timeout=5); sock.close()' "$CI_TCP_PORT"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${CI_WEB_PORT}/api/v1/activity/list")" = "401"

      - name: Verify authentication, authorization, and persisted users
        shell: bash
        env:
          CI_WEB_PORT: ${{ env.CI_WEB_PORT }}
          CI_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          CI_USER_PASSWORD: ${{ env.CI_USER_PASSWORD }}
        run: |
          set -euo pipefail
          admin_cookie="$RUNNER_TEMP/infracount-admin.cookies"
          user_cookie="$RUNNER_TEMP/infracount-user.cookies"
          api_base="http://127.0.0.1:${CI_WEB_PORT}/api/v1"
          printf '{"username":"admin","password":"%s"}' "$CI_ADMIN_PASSWORD" |
            curl --fail --silent --show-error --cookie-jar "$admin_cookie" --header 'Content-Type: application/json' --data-binary @- "$api_base/auth/login" > /dev/null
          printf '{"username":"ci-user","password":"%s","role":"user"}' "$CI_USER_PASSWORD" |
            curl --fail --silent --show-error --cookie "$admin_cookie" --header 'Content-Type: application/json' --data-binary @- "$api_base/users" > /dev/null
          printf '{"username":"ci-user","password":"%s"}' "$CI_USER_PASSWORD" |
            curl --fail --silent --show-error --cookie-jar "$user_cookie" --header 'Content-Type: application/json' --data-binary @- "$api_base/auth/login" > /dev/null
          printf '{}' |
            curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$user_cookie" --header 'Content-Type: application/json' --data-binary @- "$api_base/users" | grep --quiet '^403$'

      - name: Restart service and verify ordinary user login
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT }}
          INFRACOUNT_IMAGE: ${{ env.CI_IMAGE }}
          WEB_PORT: ${{ env.CI_WEB_PORT }}
          TCP_PORT: ${{ env.CI_TCP_PORT }}
          INITIAL_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
          CI_CONTAINER_ID: ${{ env.CI_CONTAINER_ID }}
          CI_USER_PASSWORD: ${{ env.CI_USER_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker/docker-compose.yml restart infracount
          for attempt in {1..60}; do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$CI_CONTAINER_ID")"
            if [ "$health" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$CI_CONTAINER_ID")" = "healthy"
          user_cookie="$RUNNER_TEMP/infracount-user-restart.cookies"
          printf '{"username":"ci-user","password":"%s"}' "$CI_USER_PASSWORD" |
            curl --fail --silent --show-error --cookie-jar "$user_cookie" --header 'Content-Type: application/json' --data-binary @- "http://127.0.0.1:${CI_WEB_PORT}/api/v1/auth/login" > /dev/null
          printf '{}' |
            curl --silent --output /dev/null --write-out '%{http_code}' --cookie "$user_cookie" --header 'Content-Type: application/json' --data-binary @- "http://127.0.0.1:${CI_WEB_PORT}/api/v1/users" | grep --quiet '^403$'

      - name: Verify graceful container shutdown
        shell: bash
        env:
          CI_CONTAINER_ID: ${{ env.CI_CONTAINER_ID }}
        run: |
          set -euo pipefail
          docker stop --time 20 "$CI_CONTAINER_ID" > /dev/null
          test "$(docker inspect --format '{{.State.Running}}' "$CI_CONTAINER_ID")" = "false"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$CI_CONTAINER_ID")" -eq 0

      - name: Clean up Compose containers and named volume
        if: always()
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: ${{ env.CI_COMPOSE_PROJECT }}
          INFRACOUNT_IMAGE: ${{ env.CI_IMAGE }}
          WEB_PORT: ${{ env.CI_WEB_PORT }}
          TCP_PORT: ${{ env.CI_TCP_PORT }}
          INITIAL_ADMIN_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose --env-file .env.example -f docker/docker-compose.yml down --volumes --remove-orphans
