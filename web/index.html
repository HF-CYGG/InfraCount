<!doctype html>
<!--
  入口 HTML（生产构建后也会输出到 static/spa/index.html）

  说明：
  - 这里的界面文字与 meta 统一使用中文；
  - Vite 会把 /src/main.ts 作为应用入口；
  - base 在 vite.config.ts 设置为 /spa/，因此打包后资源路径会从 /spa/assets/... 加载。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfraCount 管理后台（单页应用）</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
