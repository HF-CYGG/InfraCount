<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>告警中心 - InfraCount</title>
    <link rel="stylesheet" href="/static/style.css?v=ui_v1">
    <style>
        .kpi-card {
            text-align: center;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
            line-height: 1.2;
        }
        .kpi-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:24px; margin-bottom:24px">
    <div class="card kpi-card">
        <div class="kpi-label">总告警</div>
        <div class="kpi-value text-primary" id="kpi_total">-</div>
    </div>
    <div class="card kpi-card">
        <div class="kpi-label">严重 (Critical)</div>
        <div class="kpi-value text-danger" id="kpi_critical">-</div>
    </div>
    <div class="card kpi-card">
        <div class="kpi-label">警告 (Warning)</div>
        <div class="kpi-value text-warning" id="kpi_warning">-</div>
    </div>
    <div class="card kpi-card">
        <div class="kpi-label">一般 (Info)</div>
        <div class="kpi-value text-text" id="kpi_info">-</div>
    </div>
</div>

<div class="card">
    <div class="filter-bar" style="border:none; padding:0; margin-bottom: 16px;">
        <div class="flex items-center gap-4 flex-wrap">
             <div class="flex items-center gap-2">
                <label>设备</label>
                <select id="filterUuid" class="select" style="width:200px">
                    <option value="">所有设备</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label>记录条数</label>
                <select id="filterLimit" class="select" style="width:100px">
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
            <button class="btn btn-primary" id="queryBtn">查询</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>设备名称 (UUID)</th>
                    <th>类型</th>
                    <th>等级</th>
                    <th>状态</th>
                    <th>通知</th>
                    <th>信息</th>
                    <th>时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="alertTable"></tbody>
        </table>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="/static/layout.js?v=auth_v4"></script>
<script>
    initLayout('告警中心');

    const els = {
        uuid: document.getElementById('filterUuid'),
        limit: document.getElementById('filterLimit'),
        query: document.getElementById('queryBtn'),
        table: document.getElementById('alertTable'),
        k_total: document.getElementById('kpi_total'),
        k_crit: document.getElementById('kpi_critical'),
        k_warn: document.getElementById('kpi_warning'),
        k_info: document.getElementById('kpi_info')
    };

    let deviceMap = {};

    const TYPE_ZH = {
        low_battery: '低电量',
        battery_low: '低电量',
        low_power: '低电量',
        power_low: '低电量',
        weak_signal: '弱信号',
        signal_weak: '弱信号',
        signal_low: '弱信号',
        offline: '离线',
        device_offline: '设备离线',
        heartbeat_timeout: '心跳超时',
        time_sync_failed: '时间同步失败',
        parse_error: '解析异常',
        unknown: '未知'
    };

    function normalizeKey(v) {
        return String(v ?? '').trim();
    }

    function canonicalKey(v) {
        const s = normalizeKey(v);
        if (!s) return '';
        if (/[\u4e00-\u9fff]/.test(s)) return s;
        return s
            .replace(/([a-z0-9])([A-Z])/g, '$1_$2')
            .replace(/[\s\-]+/g, '_')
            .toLowerCase();
    }

    function parseTimeMs(v) {
        const s = normalizeKey(v);
        if (!s) return 0;
        const ms = Date.parse(s.includes('T') ? s : s.replace(' ', 'T'));
        if (Number.isFinite(ms)) return ms;
        return 0;
    }

    function isOfflineRecord(r) {
        const t = canonicalKey(r && r.type);
        const i = canonicalKey(r && r.info);
        if (t === 'offline' || t === 'device_offline') return true;
        if (t.includes('offline') || t.includes('disconnect') || t.includes('disconnected')) return true;
        if (i.includes('offline') || i.includes('disconnect') || i.includes('disconnected')) return true;
        if (t === 'signal' && i === 'offline') return true;
        if (t.includes('signal') && i.includes('offline')) return true;
        return false;
    }

    function isOnlineRecord(r) {
        const t = canonicalKey(r && r.type);
        const i = canonicalKey(r && r.info);
        if (t === 'online' || t === 'device_online') return true;
        if (t.includes('online') || t.includes('reconnect') || t.includes('reconnected')) return true;
        if (i.includes('online') || i.includes('reconnect') || i.includes('reconnected')) return true;
        if (t.includes('recovered') || i.includes('recovered')) return true;
        if (t.includes('back_online') || i.includes('back_online')) return true;
        return false;
    }

    const lastReportCache = new Map();
    const firstReportCache = new Map();

    function pad2(n) {
        return String(n).padStart(2, '0');
    }

    function formatLocalDateTime(ms) {
        const d = new Date(ms);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }

    function addSeconds(timeStr, sec) {
        const ms = parseTimeMs(timeStr);
        if (!ms) return normalizeKey(timeStr);
        return formatLocalDateTime(ms + sec * 1000);
    }

    async function getLastValidReportTime(uuid, offlineAt) {
        const u = normalizeKey(uuid);
        const t = normalizeKey(offlineAt);
        if (!u || !t) return null;
        const k = `${u}|${t}`;
        if (lastReportCache.has(k)) return lastReportCache.get(k);

        const q = new URLSearchParams({ uuid: u, end: t, limit: '1', sort_by: 'created_at' });
        try {
            const res = await fetch(`/api/v1/records/history?${q.toString()}`);
            if (res.ok) {
                const data = await res.json();
                const v = Array.isArray(data) && data[0] ? (data[0].created_at || data[0].time || null) : null;
                lastReportCache.set(k, v);
                return v;
            }
        } catch (e) {
        }

        lastReportCache.set(k, null);
        return null;
    }

    async function getFirstValidReportTime(uuid, offlineAt) {
        const u = normalizeKey(uuid);
        const t = normalizeKey(offlineAt);
        if (!u || !t) return null;

        const startAfter = addSeconds(t, 1);
        const k = `${u}|${startAfter}`;
        if (firstReportCache.has(k)) return firstReportCache.get(k);

        const q = new URLSearchParams({ uuid: u, start: startAfter, limit: '1', order: 'asc', sort_by: 'created_at' });
        try {
            const res = await fetch(`/api/v1/records/history?${q.toString()}`);
            if (res.ok) {
                const data = await res.json();
                const v = Array.isArray(data) && data[0] ? (data[0].created_at || data[0].time || null) : null;
                firstReportCache.set(k, v);
                return v;
            }
        } catch (e) {
        }

        firstReportCache.set(k, null);
        return null;
    }

    async function aggregateOfflineIntervals(rows) {
        const sortedAsc = [...(rows || [])].sort((a, b) => parseTimeMs(a.time) - parseTimeMs(b.time));
        const open = new Map();
        const out = [];
        let genId = 0;

        for (const r of sortedAsc) {
            if (!r || !r.uuid) {
                continue;
            }

            if (isOfflineRecord(r)) {
                const cur = open.get(r.uuid);
                if (!cur) {
                    const lastOkAt = await getLastValidReportTime(r.uuid, r.time);
                    open.set(r.uuid, { uuid: r.uuid, offlineAt: r.time, lastOkAt, level: Number(r.level || 0), id: r.id ?? `offline_${++genId}` });
                } else {
                    cur.level = Math.max(cur.level, Number(r.level || 0));
                }
                continue;
            }

            if (isOnlineRecord(r)) {
                const cur = open.get(r.uuid);
                if (cur) {
                    const firstReportAt = await getFirstValidReportTime(cur.uuid, cur.offlineAt);
                    const onlineAt = firstReportAt || r.time || '';
                    out.push({
                        id: cur.id,
                        uuid: cur.uuid,
                        type: 'device_offline',
                        level: cur.level,
                        info: `offline_at=${cur.offlineAt}|online_at=${onlineAt}|last_ok_at=${cur.lastOkAt || ''}`,
                        time: cur.offlineAt
                    });
                    open.delete(r.uuid);
                }
                continue;
            }

            out.push(r);
        }

        for (const cur of open.values()) {
            const firstReportAt = await getFirstValidReportTime(cur.uuid, cur.offlineAt);
            const onlineAt = firstReportAt || '';
            out.push({
                id: cur.id,
                uuid: cur.uuid,
                type: 'device_offline',
                level: cur.level,
                info: `offline_at=${cur.offlineAt}|online_at=${onlineAt}|last_ok_at=${cur.lastOkAt || ''}`,
                time: cur.offlineAt
            });
        }

        return out.sort((a, b) => parseTimeMs(b.time) - parseTimeMs(a.time));
    }

    function fmtType(type, info) {
        const raw = normalizeKey(type);
        if (!raw) return '';
        if (/[\u4e00-\u9fff]/.test(raw)) return raw;

        const key = canonicalKey(raw);
        if (TYPE_ZH[key]) return TYPE_ZH[key];

        const hint = `${key} ${canonicalKey(info)}`.trim();
        if (hint.includes('battery') && (hint.includes('low') || hint.includes('below') || hint.includes('under'))) return '低电量';
        if (hint.includes('signal') && (hint.includes('weak') || hint.includes('low') || hint.includes('below'))) return '弱信号';
        if (hint.includes('offline') || hint.includes('disconnect')) return '离线';
        if (hint.includes('heartbeat') || hint.includes('timeout')) return '心跳超时';

        return raw;
    }

    function fmtInfo(type, info) {
        const raw = normalizeKey(info);
        if (!raw) return '';
        if (/[\u4e00-\u9fff]/.test(raw)) return raw;

        if (raw.includes('offline_at=') || raw.includes('online_at=')) {
            const parts = raw.split('|').map(s => s.trim()).filter(Boolean);
            let offlineAt = '';
            let onlineAt = '';
            let lastOkAt = '';
            for (const p of parts) {
                if (p.startsWith('offline_at=')) offlineAt = p.slice('offline_at='.length).trim();
                if (p.startsWith('online_at=')) onlineAt = p.slice('online_at='.length).trim();
                if (p.startsWith('last_ok_at=')) lastOkAt = p.slice('last_ok_at='.length).trim();
            }
            if (offlineAt || onlineAt || lastOkAt) {
                return `离线时间：${offlineAt || '-'}；恢复时间：${onlineAt || '未恢复'}；最后上报：${lastOkAt || '-'}`;
            }
        }

        const inferredType = fmtType(type, info);
        if (inferredType === '低电量' && /battery|power/i.test(raw) && /low|below|under|%|level/i.test(raw)) {
            const s = raw
                .replace(/\bbattery\b/gi, '电量')
                .replace(/\bpower\b/gi, '电量')
                .replace(/\blevel\b/gi, '等级')
                .replace(/\bbelow\b/gi, '低于')
                .replace(/\bunder\b/gi, '低于');
            return s;
        }
        if (inferredType === '弱信号' && /signal|rssi/i.test(raw)) {
            const s = raw
                .replace(/\bsignal\b/gi, '信号')
                .replace(/\bstrength\b/gi, '强度')
                .replace(/\bweak\b/gi, '弱')
                .replace(/\blow\b/gi, '低')
                .replace(/\bbelow\b/gi, '低于')
                .replace(/\bthreshold\b/gi, '阈值')
                .replace(/\brssi\b/gi, 'RSSI');
            return s;
        }

        return raw
            .replace(/\bbattery\b/gi, '电量')
            .replace(/\bpower\b/gi, '电量')
            .replace(/\bsignal\b/gi, '信号')
            .replace(/\bstrength\b/gi, '强度')
            .replace(/\bbelow\b/gi, '低于')
            .replace(/\bunder\b/gi, '低于')
            .replace(/\bthreshold\b/gi, '阈值')
            .replace(/\boffline\b/gi, '离线')
            .replace(/\bdisconnect(?:ed)?\b/gi, '断开')
            .replace(/\bheartbeat\b/gi, '心跳')
            .replace(/\btimeout\b/gi, '超时');
    }

    function isNonAlertRecord(r) {
        const t = canonicalKey(r && r.type);
        const i = normalizeKey(r && r.info);
        const recType = r && (r.rec_type ?? r.recType);
        if (recType === 1 || recType === '1') return true;
        if (t.includes('rec_type')) return true;
        if (/rec_type\s*[:=]\s*1\b/i.test(i)) return true;
        return false;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    function isAckableId(v) {
        const s = normalizeKey(v);
        return /^\d+$/.test(s);
    }

    function fmtStatus(v) {
        const n = Number(v ?? 0);
        if (n === 1) return `<span class="badge badge-success">已确认</span>`;
        return `<span class="badge badge-gray">未确认</span>`;
    }

    function fmtNotify(v) {
        const n = Number(v ?? 0);
        if (n === 1) return `<span class="badge badge-success">已通知</span>`;
        if (n < 0) return `<span class="badge badge-danger">失败</span>`;
        return `<span class="badge badge-gray">未通知</span>`;
    }

    function fmtAction(r) {
        if (!r) return '-';
        if (!isAckableId(r.id)) return '-';
        if (Number(r.status ?? 0) === 1) return '-';
        return `<button class="btn btn-sm" data-ack="${r.id}">确认</button>`;
    }

    async function ackAlert(id) {
        const sid = Number(id);
        if (!Number.isFinite(sid) || sid <= 0) return;
        try {
            const res = await fetch(`/api/v1/alerts/${sid}/ack`, { method: 'POST' });
            if (res.ok) {
                showToast('已确认告警');
                await loadAlerts();
                return;
            }
        } catch (e) {
        }
        showToast('确认失败');
    }

    async function init() {
        // Load device mapping
        const mapRes = await fetch('/api/v1/devices/mapping');
        if(mapRes.ok) {
            const j = await mapRes.json();
            deviceMap = j.mapping || {};
        }

        // Load UUID options
        const devRes = await fetch('/api/v1/devices');
        if(devRes.ok) {
            const list = await devRes.json();
            list.forEach(d => {
                const uuid = typeof d === 'string' ? d : d.uuid;
                const name = deviceMap[uuid] ? (deviceMap[uuid].name || uuid) : uuid;
                const opt = document.createElement('option');
                opt.value = uuid;
                opt.textContent = name === uuid ? uuid : `${name}`;
                els.uuid.appendChild(opt);
            });
        }

        const wantedUuid = els.uuid.getAttribute('data-persist-wanted');
        if (wantedUuid) {
            els.uuid.value = wantedUuid;
            if (els.uuid.value === wantedUuid) {
                els.uuid.removeAttribute('data-persist-wanted');
            }
        }

        loadAlerts();
    }

    async function loadAlerts() {
        const uuid = els.uuid.value;
        const limit = els.limit.value;
        const q = new URLSearchParams({limit});
        if(uuid) q.append('uuid', uuid);
        
        const res = await fetch('/api/v1/alerts?' + q.toString());
        const data = await res.json();

        const filtered = (Array.isArray(data) ? data : []).filter(r => !isNonAlertRecord(r));
        const viewData = await aggregateOfflineIntervals(filtered);
        
        // Calc Stats
        let crit = 0, warn = 0, info = 0;
        viewData.forEach(r => {
            if(r.level >= 2) crit++;
            else if(r.level === 1) warn++;
            else info++;
        });
        
        els.k_total.textContent = viewData.length;
        els.k_crit.textContent = crit;
        els.k_warn.textContent = warn;
        els.k_info.textContent = info;
        
        els.table.innerHTML = viewData.map(r => {
            const entry = deviceMap[r.uuid];
            const name = entry ? (entry.name || r.uuid) : r.uuid;
            const display = name === r.uuid ? r.uuid : `${name} <span class="text-muted" style="font-size:12px">(${r.uuid.substring(0,8)}...)</span>`;
            return `
            <tr>
                <td>${r.id}</td>
                <td>${display}</td>
                <td>${fmtType(r.type, r.info)}</td>
                <td>${fmtLevel(r.level)}</td>
                <td>${fmtStatus(r.status)}</td>
                <td>${fmtNotify(r.notified)}</td>
                <td>${fmtInfo(r.type, r.info)}</td>
                <td>${r.time}</td>
                <td>${fmtAction(r)}</td>
            </tr>
            `;
        }).join('');
    }

    function fmtLevel(l) {
        if(l >= 2) return `<span class="badge badge-danger">严重</span>`;
        if(l === 1) return `<span class="badge badge-warning">警告</span>`;
        return `<span class="badge badge-gray">一般</span>`;
    }

    els.table.addEventListener('click', (e) => {
        const el = e.target;
        if (!el || typeof el.getAttribute !== 'function') return;
        const id = el.getAttribute('data-ack');
        if (id) {
            ackAlert(id);
        }
    });

    els.query.addEventListener('click', loadAlerts);
    init();

</script>
</body>
</html>
