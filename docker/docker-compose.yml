services:
  infracount:
    container_name: infracount
    image: ${INFRACOUNT_IMAGE:-infracount:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${WEB_PORT:-8000}:8000"
      - "${TCP_PORT:-8085}:8085"
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8000"
      TCP_HOST: "0.0.0.0"
      TCP_PORT: "8085"
      INFRACOUNT_NO_BROWSER: "1"
      DB_DRIVER: "${DB_DRIVER:-sqlite}"
      DB_SQLITE_PATH: "${DB_SQLITE_PATH:-/app/data/infrared.db}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-0}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-lax}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    volumes:
      - infracount-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/v1/health' % os.getenv('WEB_PORT', '8000'), timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  infracount-data:
